name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Single turbo run so lint + typecheck parallelize across packages (faster than two steps).
      - name: Lint and typecheck
        run: pnpm exec turbo run lint typecheck

      # Playwright (loadout) is in .github/workflows/loadout-e2e.yml — Vitest only here.
      - name: Test (exclude @codalyn/loadout)
        run: pnpm exec turbo run test --filter='!@codalyn/loadout'

      - name: Build
        run: pnpm build
