# Monorepo verify: run the full turbo graph (lint, typecheck, test, build). Speed comes from
# Turborepo task caching, optionally remote: add repo secrets TURBO_TOKEN + TURBO_TEAM (Vercel).
# Deliberately no "affected only" build filter here — that is easy to get wrong; cache is the
# standard fix for long CI. See: https://turbo.build/docs/ci-vendors/github-actions
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Single turbo run so lint + typecheck parallelize across packages (faster than two steps).
      - name: Lint and typecheck
        run: pnpm exec turbo run lint typecheck

      # Playwright (loadout) is in .github/workflows/loadout-e2e.yml — Vitest only here.
      - name: Test (exclude @codalyn/loadout)
        run: pnpm exec turbo run test --filter='!@codalyn/loadout'

      - name: Build
        run: pnpm build

  # Production deploy for Tower runs here (not Vercel auto-deploy) so it only ships CI-green code.
  # Vercel auto-deploy for main is disabled in apps/tower/vercel.json (git.deploymentEnabled);
  # branch/PR preview deploys still come from the Vercel git integration. The build itself still
  # runs on Vercel — this job only triggers it. Requires repo secrets VERCEL_TOKEN,
  # VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  deploy-tower:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
