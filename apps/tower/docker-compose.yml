# Project name prefixes containers, networks, and volumes so this stack stays distinct
# from other Docker Compose projects on the same machine (`docker compose ls`).
#
# Reserved host ports (override via `.env` — see `.env.compose.example`):
#   Postgres: ${POSTGRES_PORT:-35432}  (Codalyn Tower default; not 5432 to avoid clashes)
#   Tower UI: ${TOWER_PORT:-3100}
name: codalyn-tower

services:
  postgres:
    image: postgres:16-alpine
    container_name: codalyn-tower-db
    environment:
      POSTGRES_USER: tower
      POSTGRES_PASSWORD: tower
      POSTGRES_DB: tower
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - tower_pgdata:/var/lib/postgresql/data
    networks:
      - tower
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tower -d tower"]
      interval: 5s
      timeout: 5s
      retries: 5

  tower:
    build:
      context: ../..
      dockerfile: apps/tower/Dockerfile
    image: codalyn-tower:latest
    container_name: codalyn-tower-app
    init: true
    ports:
      # Host port defaults to 3100 to avoid clashing with other Next.js apps; override: TOWER_PORT=3000
      - "${TOWER_PORT:-3100}:3000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - tower

volumes:
  tower_pgdata:

networks:
  tower:
    name: codalyn-tower-net
